[project]
name = "documind"
version = "0.1.0"
description = "DocuMind PDF document assistant"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40.0",
    "groq>=0.11.0",
    "pypdf>=4.3.1",
    "tiktoken>=0.7.0",
    "python-dotenv>=1.0.1",
    "tenacity>=8.5.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
]

[tool.vercel]
entrypoint = "api:app"
